<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://anecakefair.com.br/origem/">
<title>Ane Cakes Fair | Da Origem ao Destino</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7efe4}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe src="/origem.html" title="Ane Cakes Fair — Da Origem ao Destino" allow="autoplay"></iframe>
<script>
const frame=document.querySelector('iframe');
frame.addEventListener('load',()=>{
  try{
    frame.contentDocument.querySelectorAll('a').forEach(a=>{
      if(a.getAttribute('href') && !a.getAttribute('href').startsWith('#')) a.setAttribute('target','_top');
    });
  }catch(e){}
});
</script>
</body>
</html>
