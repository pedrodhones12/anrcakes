<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Notícia | Ane Cakes Fair"><title>Notícia | Ane Cakes Fair</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="/roteiro-chat.css"><style>main{max-width:820px;margin:auto;padding:120px 24px 80px}.article-cat{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9d1026;font-weight:700}.article-title{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,5vw,48px);line-height:1.15;margin:14px 0 18px;color:#1c1917}.article-meta{display:flex;align-items:center;gap:14px;font-size:13px;color:#8a7165;margin-bottom:30px}.article-hero{width:100%;max-height:420px;object-fit:cover;border-radius:18px;margin-bottom:34px}.article-content{line-height:1.85;font-size:17px;color:#44403c}.article-content p{margin-bottom:1.3rem}.article-content h2{font-family:'Cormorant Garamond',serif;font-size:1.7rem;color:#1c1917;margin-top:2rem;margin-bottom:.8rem}.article-content h3{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:#1c1917;margin-top:1.5rem;margin-bottom:.6rem}.article-content img{border-radius:.5rem;margin:1.2rem 0;max-width:100%}.article-content a{color:#9d1026;text-decoration:underline}.article-content ul,.article-content ol{margin-left:1.5rem;margin-bottom:1.2rem}.article-content li{margin-bottom:.4rem}.article-content blockquote{border-left:3px solid #d6d3d1;padding-left:1rem;color:#78716c;font-style:italic;margin:1.2rem 0}.article-content iframe{width:100%;aspect-ratio:16/9;border-radius:12px;margin:1.2rem 0;border:0}.article-video{width:100%;border-radius:18px;margin-bottom:34px}.article-loading{text-align:center;padding:80px 20px;color:#6a574d}.article-loading span{display:inline-block;width:28px;height:28px;border:3px solid #e0d0c0;border-top-color:#9d1026;border-radius:50%;animation:artSpin 1s linear infinite;vertical-align:middle;margin-right:10px}@keyframes artSpin{to{transform:rotate(360deg)}}.article-notfound{text-align:center;padding:80px 20px}.article-notfound h2{font-family:'Cormorant Garamond',serif;font-size:32px;margin-bottom:12px}.article-notfound p{color:#6a574d;margin-bottom:24px}.article-back{display:inline-block;background:#6B2328;color:#fff;padding:12px 28px;border-radius:999px;text-decoration:none;font-weight:600}</style></head><body><div class="announcement">ANE CAKES FAIR · NOTÍCIA</div><header class="nav"><a class="brand" href="/"><img src="assets/image2.png" alt="Ane Cakes Fair"></a><nav class="main-nav"><a href="/">Início</a><a href="/noticias/">Notícias</a><a href="/ingressos/">Ingressos</a></nav><a class="nav-cta" href="/noticias/">← Voltar</a></header><main id="articleMain"><div class="article-loading"><span></span>Carregando notícia...</div></main><footer><span>ANE CAKES FAIR</span><span>Notícias · Ilhéus, Bahia</span><a href="/noticias/">Ver todas</a><span class="footer-credit">Desenvolvido por Construindo Sonhos Web</span></footer><script>var API_URL="https://ane-story-engine.base44.app/functions/news";function escapeHtml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}function formatDate(d){if(!d)return"";try{return new Date(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"})}catch(e){return""}}function renderArticle(n){var main=document.getElementById("articleMain");document.title=n.title+" | Ane Cakes Fair";var date=formatDate(n.published_at);var metaHtml='';if(n.author_name||date){metaHtml='<div class="article-meta">';if(n.author_name)metaHtml+='<span>Por '+escapeHtml(n.author_name)+'</span>';if(n.author_name&&date)metaHtml+='<span>·</span>';if(date)metaHtml+='<span>'+date+'</span>';metaHtml+='</div>'}var heroHtml=n.image_url?'<img class="article-hero" src="'+escapeHtml(n.image_url)+'" alt="'+escapeHtml(n.title)+'">':'';var videoHtml=n.video_url?'<video class="article-video" controls src="'+escapeHtml(n.video_url)+'"></video>':'';main.innerHTML='<span class="article-cat">'+escapeHtml(n.category)+'</span><h1 class="article-title">'+escapeHtml(n.title)+'</h1>'+metaHtml+heroHtml+videoHtml+'<div class="article-content">'+(n.content||"")+'</div>'}var slug=new URLSearchParams(window.location.search).get("slug");if(!slug){document.getElementById("articleMain").innerHTML='<div class="article-notfound"><h2>Notícia não encontrada</h2><p>Nenhum artigo foi especificado.</p><a class="article-back" href="/noticias/">Ver todas as notícias</a></div>'}else{fetch(API_URL+"?slug="+encodeURIComponent(slug)).then(function(r){return r.json()}).then(function(data){if(data&&data.success&&data.news){renderArticle(data.news)}else{document.getElementById("articleMain").innerHTML='<div class="article-notfound"><h2>Notícia não encontrada</h2><p>Esta notícia pode ter sido removida ou ainda não foi publicada.</p><a class="article-back" href="/noticias/">Ver todas as notícias</a></div>'}}).catch(function(){document.getElementById("articleMain").innerHTML='<div class="article-notfound"><h2>Erro ao carregar</h2><p>Não foi possível carregar esta notícia agora.</p><a class="article-back" href="/noticias/">Ver todas as notícias</a></div>'})}</script><script src="/roteiro-chat.js"></script></body></html>
